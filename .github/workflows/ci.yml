name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Reproduce demo
        run: python -m ico.cli demo --seed 42 --days 365 --output generated
      - name: Check dashboard JavaScript
        run: |
          node --check dashboard/analytics.js
          node --check dashboard/app.js
      - name: Verify dashboard against Python engine
        run: python scripts/check_dashboard.py
      - name: Verify reproducible public dataset
        run: |
          python scripts/build_dashboard.py
          git diff --exit-code -- dashboard/data.js
  publish-dashboard:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package synthetic dashboard only
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dashboard
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
