[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "operational-conduct-index"
version = "0.1.0"
description = "Auditable operational conduct analytics with fully synthetic transport data"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
ico = "ico.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
